[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-netops-toolkit"
version = "0.1.0"
description = "ATLAS Security NetOps Toolkit"
requires-python = ">=3.11"

[project.scripts]
atlas = "netdiag.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
