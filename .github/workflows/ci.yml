name: ATLAS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ATLAS image
        run: docker build -t atlas-netops:ci .

      - name: Verify non-root user
        run: |
          docker run --rm \
            --entrypoint id \
            atlas-netops:ci

      - name: Run container smoke test
        run: |
          docker run --rm \
            atlas-netops:ci \
            logs sample-data/auth.log
